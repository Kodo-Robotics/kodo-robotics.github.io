title: "Kodo Robotics"
description: "Software infrastructure, simulation systems, and developer tools for robotics."
url: "https://kodorobotics.com"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes@4.24.0"

plugins:
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-feed

markdown: kramdown
permalink: /:categories/:title/
minimal_mistakes_skin: "dark"
logo: "/assets/images/logo.png"
favicon: "/assets/images/favicon.ico"

author:
  name: "Sakshay Mahna"

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: false

analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-GHPB11M47Y"
    anonymize_ip: false

atom_feed:
  hide: true

footer:
  links:
    - label: "Kodo Robotics GitHub"
      icon: "fab fa-github"
      url: "https://github.com/Kodo-Robotics"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://linkedin.com/in/sakshaymahna"
    - label: "Robotics with Sakshay"
      icon: "fab fa-youtube"
      url: "https://www.youtube.com/@RoboticswithSakshay"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:kodorobotics@gmail.com"
